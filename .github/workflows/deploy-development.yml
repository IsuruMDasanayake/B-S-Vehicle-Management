name: Deploy Development

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 30m
          script: |
            # Navigate to the project directory
            cd /var/www/bnstransports_dev
            
            # Pull latest changes from development branch
            git fetch origin development
            git reset --hard origin/development
            
            # Set frontend command to build and preview for development server
            export FRONTEND_CMD="sh -c 'npm run build && npm run preview -- --host 0.0.0.0 --port 5173'"
            
            # Restart docker containers with dev profile
            docker compose -p bsv_dev up -d --build
            
            # Force recreate the frontend container and nginx (to restore proxy ports)
            docker compose -p bsv_dev up -d --force-recreate frontend nginx
            
            # Install PHP Dependencies (since host mount overwrites vendor folder)
            docker compose -p bsv_dev exec -T backend composer install --no-dev --optimize-autoloader --no-interaction
            
            # Run database migrations
            docker compose -p bsv_dev exec -T backend php artisan migrate --force
            
            # Clear caches
            docker compose -p bsv_dev exec -T backend php artisan cache:clear
            docker compose -p bsv_dev exec -T backend php artisan config:clear
