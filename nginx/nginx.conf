server {
    listen 80;
    server_name circlegroup.lk www.circlegroup.lk localhost;

    # Allow Let's Encrypt HTTP challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name circlegroup.lk www.circlegroup.lk localhost;
    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/circlegroup.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/circlegroup.lk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Docker DNS resolver to dynamically resolve container IPs
    resolver 127.0.0.11 valid=10s;

    # ─── Frontend (React SPA) ────────────────────────────────────────────────
    location / {
        set $frontend http://frontend:5173;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Reverb WebSockets ───────────────────────────────────────────────────
    location /app/ {
        set $reverb http://reverb:8080;
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # ─── Backend API ─────────────────────────────────────────────────────────
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
    }

    location ~ \.php$ {
        set $backend backend:9000;
        fastcgi_pass $backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    # ─── Security Headers ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    client_max_body_size 50M;
    sendfile off;
}
